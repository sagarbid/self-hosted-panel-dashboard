# Glance — Sagar's family panel dashboard
# 15.6" FotoCube panel: 1280x800 landscape, WebView 106
# Columns: small = fixed 300px, full = remaining. Max 3 cols, needs 1-2 full.

server:
  port: 8081

pages:
  # ============================================================
  # HOME — dashboard
  # ============================================================
  - name: Home
    columns:
      - size: small
        widgets:
          - type: clock
            hour-format: 24h
            timezones:
              - timezone: Australia/Melbourne
                label: Melbourne
              - timezone: UTC
                label: UTC

          - type: weather
            location: Melbourne, Australia
            units: metric
            hour-format: 24h
            hide-location: false

          - type: calendar
            first-day-of-week: monday

          - type: server-stats
            hide-swap: true

      - size: full
        widgets:
          # ---- live portfolio (CoinGecko, keyless) ----
          - type: custom-api
            title: Portfolio
            cache: 5m
            url: https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&ids=bittensor,venice-token,meteora,moonbeam&price_change_percentage=24h
            template: |
              <ul class="list list-gap-10">
              {{ range .JSON.Array "" }}
                <li>
                  <a class="flex items-center gap-10" href="https://www.coingecko.com/en/coins/{{ .String "id" }}" target="_blank">
                    <img src="{{ .String "image" }}" alt="" style="width:22px;height:22px;border-radius:50%">
                    <span class="color-highlight size-h4" style="text-transform:uppercase;min-width:64px">{{ .String "symbol" }}</span>
                    <span class="grow color-base" style="font-size:0.85em">{{ .String "name" }}</span>
                    <span style="min-width:92px;text-align:right">{{ .Float "current_price" | printf "$%.4f" }}</span>
                    {{ if lt (.Float "price_change_percentage_24h") 0.0 }}
                    <span class="color-negative" style="min-width:70px;text-align:right">{{ .Float "price_change_percentage_24h" | printf "%.2f" }}%</span>
                    {{ else }}
                    <span class="color-positive" style="min-width:70px;text-align:right">+{{ .Float "price_change_percentage_24h" | printf "%.2f" }}%</span>
                    {{ end }}
                  </a>
                </li>
              {{ end }}
              </ul>

          # ---- homelab container status ----
          - type: docker-containers
            socket: /var/run/docker.sock
            hide-by-default: false
            show-message: false
            compact: true

          - type: hacker-news
            limit: 8
            collapse-after: 4
            comments-url-template: https://news.ycombinator.com/item?id={{ .ID }}

      - size: small
        widgets:
          - type: rss
            title: Cyber Security
            limit: 12
            collapse-after: 5
            cache: 30m
            feeds:
              - url: https://feeds.feedburner.com/TheHackersNews
                title: The Hacker News
              - url: https://www.bleepingcomputer.com/feed/
                title: BleepingComputer
              - url: https://krebsonsecurity.com/feed/
                title: Krebs on Security

          - type: rss
            title: AI & Tech
            limit: 10
            collapse-after: 5
            cache: 30m
            feeds:
              - url: https://openai.com/blog/rss.xml
                title: OpenAI
              - url: https://blog.google/technology/ai/rss/
                title: Google AI
              - url: https://www.technologyreview.com/topic/artificial-intelligence/feed
                title: MIT Tech Review

  # ============================================================
  # MEDIA — streaming
  # ============================================================
  - name: Media
    width: wide
    columns:
      - size: small
        widgets:
          - type: bookmarks
            groups:
              - name: Streaming Apps
                color: 267 84 81
                links:
                  - title: SmartTube
                    subtitle: YouTube · ad-free
                    url: intent://browse#Intent;package=org.smarttube.stable;end
                  - title: NewPipe
                    subtitle: YouTube · PeerTube
                    url: intent://#Intent;package=org.schabi.newpipe;end
                  - title: Jellyfin
                    subtitle: media server client
                    url: intent://#Intent;package=org.jellyfin.mobile;end
                  - title: RockVideo
                    subtitle: hw-accelerated player
                    url: intent://#Intent;package=android.rk.RockVideoPlayer;end
                  - title: YouTube Web
                    subtitle: Browser player
                    url: https://m.youtube.com
                  - title: Twitch
                    subtitle: Live streams
                    url: https://m.twitch.tv

              - name: Return
                color: 115 54 76
                links:
                  - title: Back to Dashboard
                    subtitle: reloads this page
                    url: http://192.168.4.53:8081

          - type: custom-api
            title: "How to exit an app"
            cache: 24h
            url: http://127.0.0.1:8082/api/state
            template: |
              <p class="color-paragraph" style="font-size:0.85em">
                Apps open over this dashboard. To come back, press the panel's
                <strong class="color-highlight">HOME</strong> button — or send:<br>
                <code>adb shell input keyevent 3</code>
              </p>

      - size: full
        widgets:
          - type: iframe
            source: http://192.168.4.53:8083/
            height: 1400

  # ============================================================
  # KIDS — Ellysse
  # ============================================================
  - name: Kids
    width: wide
    columns:
      - size: full
        widgets:
          - type: iframe
            source: http://192.168.4.53:8082/kids
            height: 1560

  # ============================================================
  # PHOTOS — digital photo frame
  # ============================================================
  - name: Photos
    width: wide
    hide-desktop-navigation: true
    columns:
      - size: full
        widgets:
          - type: iframe
            source: http://192.168.4.53:8082/photos
            height: 760

theme:
  background-color: 240 21 15
  primary-color: 217 92 83
  positive-color: 115 54 76
  negative-color: 347 70 65
  contrast-multiplier: 1.2
